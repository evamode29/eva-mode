{% load static %}
<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="EVA MODE؛ به‌زودی با یک تجربه متفاوت از مد و ظرافت در کنار شماست.">
  <title>EVA MODE | به‌زودی</title>
  <link rel="stylesheet" href="{% static 'css/eva.css' %}">
  <style>
    .coming-soon{min-height:calc(100vh - 77px);display:grid;place-items:center;padding:30px 20px;position:relative;overflow:hidden;background:radial-gradient(circle at 15% 20%,rgba(152,126,107,.14),transparent 30%),radial-gradient(circle at 85% 80%,rgba(152,126,107,.10),transparent 28%),var(--bg)}
    .coming-card{width:min(760px,100%);text-align:center;padding:70px 30px;border:1px solid var(--border);border-radius:30px;background:rgba(255,253,250,.78);box-shadow:0 30px 90px rgba(33,31,29,.10);backdrop-filter:blur(16px)}
    .coming-logo{font-size:clamp(34px,7vw,64px);font-weight:700;letter-spacing:7px;margin:0 0 22px}.coming-logo span{font-weight:400;color:var(--accent)}
    .coming-kicker{display:inline-block;color:var(--accent);font-size:11px;font-weight:700;letter-spacing:3px;margin-bottom:12px}
    .coming-card h1{font-size:clamp(30px,5vw,48px);line-height:1.35;margin:0 0 18px}.coming-card p{max-width:560px;margin:0 auto 30px;color:var(--muted);font-size:15px;line-height:2}
    .coming-line{width:70px;height:2px;background:var(--accent);margin:0 auto 28px;border-radius:99px}.coming-note{font-size:10px;color:var(--muted);letter-spacing:2px}
    .coming-footer{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:var(--muted);font-size:10px}
    @media(max-width:600px){.coming-card{padding:55px 22px;border-radius:24px}.coming-card p{font-size:13px}.coming-logo{letter-spacing:4px}}
  </style>
</head>
<body>
  <main class="coming-soon">
    <section class="coming-card" aria-labelledby="coming-title">
      <span class="coming-kicker">EVA MODE / PRIVATE COLLECTION</span>
      <div class="coming-logo" aria-label="EVA MODE">E<span>VA</span> MODE</div>
      <div class="coming-line"></div>
      <h1 id="coming-title">به‌زودی با یک تجربه متفاوت برمی‌گردیم.</h1>
      <p>فروشگاه EVA MODE در حال آماده‌سازی یک تجربه تازه، لوکس و متفاوت برای توست. کمی صبر کن؛ اتفاق زیبایی در راه است.</p>
      <span class="coming-note">SOMETHING BEAUTIFUL IS COMING</span>
    </section>
    <div class="coming-footer">EVA MODE · فروشگاه تخصصی لباس زیر زنانه</div>
  </main>
</body>
</html>
